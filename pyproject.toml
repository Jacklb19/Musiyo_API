[project]
name = "musiyo-api"
version = "0.1.0"
description = "API de Musiyo Bëtsknaté"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic==1.20.0"
]

[project.scripts]
musiyo = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
