name: musiyo-local
services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_DB: musiyo
      POSTGRES_USER: musiyo
      POSTGRES_PASSWORD: ${MUSIYO_DB_PASSWORD:?Set MUSIYO_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musiyo -d musiyo"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MUSIYO_S3_ACCESS_KEY:?Set MUSIYO_S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MUSIYO_S3_SECRET_KEY:?Set MUSIYO_S3_SECRET_KEY in .env}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment:
      MUSIYO_DATABASE_URL: postgresql+psycopg://musiyo:${MUSIYO_DB_PASSWORD}@postgres:5432/musiyo
      MUSIYO_STORAGE_ROOT: /storage
      MUSIYO_STORAGE_BACKEND: s3
      MUSIYO_LOCAL_COMPOSE: "1"
      MUSIYO_S3_ENDPOINT: http://minio:9000
      MUSIYO_S3_PUBLIC_ENDPOINT: ${MUSIYO_S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      MUSIYO_S3_BUCKET: musiyo-private
      MUSIYO_S3_ACCESS_KEY: ${MUSIYO_S3_ACCESS_KEY}
      MUSIYO_S3_SECRET_KEY: ${MUSIYO_S3_SECRET_KEY}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["private-data:/storage"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  object-data:
  private-data:
